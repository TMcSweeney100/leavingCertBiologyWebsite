<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"><link rel="stylesheet" href="mock.css"><script src="blocks.js"></script><title>Student page, B: two columns</title></head>
<body>
<div id="root"></div>
<script>
document.getElementById('root').innerHTML = B.appbar() + `
<main style="max-width:1240px;margin:0 auto;padding:28px 0 48px">
  ${B.back()}
  <div style="display:grid;grid-template-columns:420px minmax(0,1fr);gap:16px;align-items:start;margin-top:12px">
    <div class="stack" style="position:sticky;top:16px">
      ${B.who(true)}
      ${B.hero()}
      ${B.checkpoints({ openStage: 0, narrow: true })}
    </div>
    <div class="stack">
      ${B.waiting()}
      ${B.log()}
    </div>
  </div>
</main>`;
</script>
</body></html>
