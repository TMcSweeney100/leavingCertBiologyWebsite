<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item view, editing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 440px; height: 900px; background: #F1F3F6">
  <dc-import name="ItemInDrawer" start-editing="{{yes}}" hint-size="440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
