spring:
  application:
    name: coursework

  config:
    # Local overrides from backend/.env (git-ignored). Containers have no such file; the host
    # injects environment variables instead.
    import: optional:file:.env[.properties]

  datasource:
    # JDBC form, not the postgres:// URL most hosts print. See Task 11.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/coursework}
    username: ${DATABASE_USERNAME:coursework}
    password: ${DATABASE_PASSWORD:coursework}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Applied migrations are never edited. Changes get a new migration.
    validate-on-migrate: true

  session:
    # Stored in Postgres so a deploy doesn't sign everyone out (design §5.2).
    timeout: 7d
    jdbc:
      # Flyway owns the schema (V3__spring_session.sql).
      initialize-schema: never

server:
  # Loopback locally. The container image sets SERVER_ADDRESS=0.0.0.0.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        # true everywhere except a local backend served over plain http (backend/.env).
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  proxy-secret: ${PROXY_SHARED_SECRET:}
  login-limits:
    per-username: 5
    per-address: 100
    window: 15m

---
spring:
  config:
    activate:
      on-profile: test
# Testcontainers supplies the datasource through @ServiceConnection.

server:
  servlet:
    session:
      cookie:
        # Pinned so a developer's backend/.env can't change what the cookie tests assert.
        secure: true
